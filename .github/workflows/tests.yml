name: tests

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run unit tests
        run: ./scripts/test.sh -type unit
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      TESTS_CONFIG: ${{ secrets.TESTS_CONFIG }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install emulator dependencies
        run: sudo apt-get install -y libpulse0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify integration test config is present
        run: |
          if [ -z "${TESTS_CONFIG}" ]; then
            echo "ERROR: TESTS_CONFIG secret is not set. Integration tests would be skipped."
            exit 1
          fi
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window -gpu off
          script: ./scripts/test.sh -type android -config "${TESTS_CONFIG}"
